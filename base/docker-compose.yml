# Ambiente de desenvolvimento do código base.
#
# Sobe a API, o banco e a interface web compilando o código local. O compose da sua entrega é
# diferente: ele usa `image:` apontando para as imagens que você publicou no Docker Hub.
# Veja participantes/exemplo/docker-compose.yml.

services:
  api:
    build: ./backend-dotnet
    ports:
      - "9999:8080"
    environment:
      # Credenciais dev-only, com default local (sobe sem .env, exigência do verificar.sh).
      # Sobrescreva criando um .env (ver .env.example na raiz do repositório).
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-desafio};Username=${POSTGRES_USER:-desafio};Password=${POSTGRES_PASSWORD:-desafio}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desafio}
      POSTGRES_USER: ${POSTGRES_USER:-desafio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desafio}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-desafio} -d ${POSTGRES_DB:-desafio}"]
      interval: 3s
      timeout: 3s
      retries: 15
