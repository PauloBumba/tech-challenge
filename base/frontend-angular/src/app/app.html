<div class="min-h-screen bg-[#f5f8fa] lg:flex">
  @if (menuAberto()) {
    <button class="fixed inset-0 z-30 bg-gray-950/60 lg:hidden" type="button" aria-label="Fechar menu" (click)="fecharMenu()"></button>
  }

  <aside
    class="painel-lateral fixed inset-y-0 left-0 z-40 w-72 shrink-0 overflow-y-auto bg-sidebar text-slate-200 shadow-2xl lg:static lg:shadow-none"
    [class.menu-aberto]="menuAberto()"
    aria-label="Navegação principal"
  >
    <div class="flex h-20 items-center justify-between border-b border-white/10 px-5">
      <a class="flex items-center gap-3" routerLink="/inicio" (click)="fecharMenu()" aria-label="SaúdeAdmin, ir para início">
        <svg class="size-10 shrink-0" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="14" fill="#14b8a6" />
          <path d="M24 10c-7.3 0-13.2 5.9-13.2 13.2 0 9.7 13.2 16.8 13.2 16.8s13.2-7.1 13.2-16.8C37.2 15.9 31.3 10 24 10Z" fill="#e6fffb" />
          <path d="M16.6 24h4.7l2.5-5.1 3.2 10.2 2.1-5.1h3.4" fill="none" stroke="#0b5f5a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" />
        </svg>
        <span class="leading-tight"><strong class="block text-lg tracking-tight text-white">Saúde<span class="text-teal-300">Admin</span></strong><small class="text-[10px] font-medium uppercase tracking-[0.18em] text-slate-400">Gestão assistencial</small></span>
      </a>
      <button class="rounded p-2 text-slate-300 hover:bg-white/10 lg:hidden" type="button" aria-label="Fechar menu" (click)="fecharMenu()">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
    </div>

    <div class="px-4 py-6">
      <p class="px-3 text-xs font-semibold uppercase tracking-wider text-slate-500">Gestão</p>
      <nav class="mt-3 grid gap-1">
        <a routerLink="/inicio" routerLinkActive="bg-admin-600 text-white shadow-sm" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium hover:bg-sidebar-hover hover:text-white" (click)="fecharMenu()">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12 12 3l9 9v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg>
          Início
        </a>
        <a routerLink="/beneficiarios" routerLinkActive="bg-admin-600 text-white shadow-sm" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium hover:bg-sidebar-hover hover:text-white" (click)="fecharMenu()">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg>
          Beneficiários
        </a>
        <a routerLink="/planos" routerLinkActive="bg-admin-600 text-white shadow-sm" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium hover:bg-sidebar-hover hover:text-white" (click)="fecharMenu()">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v15.5M4 19.5A2.5 2.5 0 0 0 6.5 22H20M4 19.5A2.5 2.5 0 0 1 6.5 17H20M8 6h8M8 10h8" /></svg>
          Planos
        </a>
      </nav>

      <p class="mt-8 px-3 text-xs font-semibold uppercase tracking-wider text-slate-500">Sistema</p>
      <nav class="mt-3 grid gap-1">
        <a routerLink="/observabilidade" routerLinkActive="bg-admin-600 text-white shadow-sm" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium hover:bg-sidebar-hover hover:text-white" (click)="fecharMenu()">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18M7 16v-5M12 16V7M17 16v-8" /></svg>
          Observabilidade
        </a>
      </nav>
    </div>

    <div class="absolute inset-x-0 bottom-0 border-t border-white/10 p-4 text-xs text-slate-400">Ambiente local · v1.0</div>
  </aside>

  <div class="flex min-h-screen min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-20 flex h-16 items-center justify-between border-b border-gray-200 bg-white px-4 shadow-sm sm:px-6">
      <div class="flex items-center gap-3">
        <button class="rounded-lg p-2 text-gray-600 hover:bg-gray-100 lg:hidden" type="button" aria-label="Abrir menu" [attr.aria-expanded]="menuAberto()" (click)="alternarMenu()">
          <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-gray-500">Gestão assistencial</p>
          <h1 class="text-base font-semibold text-gray-900 sm:text-lg">Cadastro de Beneficiários</h1>
        </div>
      </div>
      <app-status-da-api />
    </header>

    <main class="w-full flex-1 p-4 sm:p-6 lg:p-8"><router-outlet /></main>
    <footer class="border-t border-gray-200 bg-white px-4 py-4 text-xs text-gray-500 sm:px-6">SaúdeAdmin · Dados operacionais consultados diretamente na API</footer>
  </div>
  <app-notificacao-toast />
</div>
