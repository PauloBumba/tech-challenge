<form class="formulario" [formGroup]="formulario" (ngSubmit)="salvar()">
  <header class="cabecalho">
    <h3>{{ beneficiario ? 'Editar beneficiário' : 'Novo beneficiário' }}</h3>
    <button type="button" class="botao-fechar" (click)="cancelado.emit()" aria-label="Fechar">
      ×
    </button>
  </header>

  @if (erro()) {
    <p class="aviso erro">{{ erro() }}</p>
  }

  <div class="campos">
    <label
      class="campo"
      [class.invalido]="formulario.controls.nome_completo.invalid && formulario.controls.nome_completo.touched"
    >
      <span>Nome completo</span>
      <input
        formControlName="nome_completo"
        type="text"
        maxlength="120"
        placeholder="Nome completo do beneficiário"
      />
      @if (formulario.controls.nome_completo.invalid && formulario.controls.nome_completo.touched) {
        <small>Informe o nome completo (mínimo 3 caracteres).</small>
      }
    </label>

    <label
      class="campo"
      [class.invalido]="formulario.controls.cpf.invalid && formulario.controls.cpf.touched"
    >
      <span>CPF</span>
      <input formControlName="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" />
      @if (formulario.controls.cpf.invalid && formulario.controls.cpf.touched) {
        <small>Informe um CPF válido.</small>
      }
      @if (beneficiario) {
        <small class="dica">CPF não pode ser alterado na edição.</small>
      }
    </label>

    <label
      class="campo"
      [class.invalido]="formulario.controls.data_nascimento.invalid && formulario.controls.data_nascimento.touched"
    >
      <span>Data de nascimento</span>
      <input formControlName="data_nascimento" type="date" />
      @if (formulario.controls.data_nascimento.invalid && formulario.controls.data_nascimento.touched) {
        <small>Informe uma data de nascimento no passado.</small>
      }
    </label>

    <label
      class="campo"
      [class.invalido]="formulario.controls.plano_id.invalid && formulario.controls.plano_id.touched"
    >
      <span>Plano</span>
      <select formControlName="plano_id">
        <option value="" disabled>Selecione um plano</option>
        @for (plano of planos; track plano.id) {
          <option [value]="plano.id">{{ plano.nome }}</option>
        }
      </select>
      @if (formulario.controls.plano_id.invalid && formulario.controls.plano_id.touched) {
        <small>Selecione o plano.</small>
      }
    </label>

    @if (beneficiario) {
      <label class="campo">
        <span>Situação</span>
        <select formControlName="status">
          @for (status of statuses; track status) {
            <option [value]="status">{{ status }}</option>
          }
        </select>
      </label>
    }
  </div>

  <footer class="acoes">
    <button type="button" class="botao" (click)="cancelado.emit()">Cancelar</button>
    <button type="submit" class="botao primario" [disabled]="enviando()">
      {{ enviando() ? 'Salvando...' : (beneficiario ? 'Salvar' : 'Cadastrar') }}
    </button>
  </footer>
</form>
