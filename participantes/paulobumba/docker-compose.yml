# Entrega do desafio técnico 4Tech - Paulo Mário Valente Bumba
#
# Esta configuração usa as imagens publicadas no Docker Hub multi-arch (linux/amd64, linux/arm64)
# Imagens: bumab/desafio-4tech-api:latest e bumab/desafio-4tech-web:latest

services:
  api:
    image: bumab/desafio-4tech-api:latest
    ports:
      - "9999:8080"
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=desafio;Username=desafio;Password=desafio"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: bumab/desafio-4tech-web:latest
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: desafio
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d desafio"]
      interval: 3s
      timeout: 3s
      retries: 15
